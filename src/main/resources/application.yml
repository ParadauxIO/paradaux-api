spring:
  application:
    name: paradaux-api
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Schema migrations run at startup from classpath:db/migration.
  # V1-V3 were applied by hand before Flyway, so a database that already has
  # these schemas but no history table is baselined at 3 instead of re-running
  # them; an empty database gets V1-V3. History: api.flyway_schema_history.
  flyway:
    schemas: api,analytics,geoip
    baseline-on-migrate: true
    baseline-version: 3
    baseline-description: "Pre-Flyway schema (V1-V3 applied by hand)"

cloudflare:
  turnstile:
    secret: ${CLOUDFLARE_TURNSTILE_SECRET}

discord:
  webhook: ${DISCORD_WEBHOOK}

mybatis:
  type-aliases-package: io.paradaux.api.models
  mapper-locations: classpath:mappers/*.xml
  type-handlers-package: io.paradaux.api.mappers.typehandlers

maxmind:
  base-url: https://download.maxmind.com/app/geoip_download

# Actuator on a dedicated management port (8081) so /actuator/prometheus is
# reachable in-cluster (ServiceMonitor) but never via the public api.paradaux.io
# route, which only fronts the app port (8080).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}